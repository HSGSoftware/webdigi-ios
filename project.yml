name: WebDigi
options:
  bundleIdPrefix: com.webdigistore
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    CODE_SIGN_STYLE: Manual
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"

targets:
  WebDigi:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: WebDigi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: App/App.entitlements
      properties:
        com.apple.developer.associated-domains:
          - applinks:webdigistore.com
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webdigistore.kur
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)
    dependencies:
      - target: WebDigiClip
        embed: true
        codeSign: true

  WebDigiClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - Clip
      - Shared
    info:
      path: Clip/Info.plist
      properties:
        CFBundleDisplayName: WebDigi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSAppClip:
          NSAppClipRequestEphemeralUserNotification: false
          NSAppClipRequestLocationConfirmation: false
    entitlements:
      path: Clip/Clip.entitlements
      properties:
        com.apple.developer.associated-domains:
          - appclips:webdigistore.com
          - applinks:webdigistore.com
        com.apple.developer.parent-application-identifiers:
          - $(AppIdentifierPrefix)com.webdigistore.kur
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.webdigistore.kur.Clip
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "Apple Distribution"
        DEVELOPMENT_TEAM: $(DEVELOPMENT_TEAM)

schemes:
  WebDigi:
    build:
      targets:
        WebDigi: all
    run:
      config: Debug
    archive:
      config: Release
