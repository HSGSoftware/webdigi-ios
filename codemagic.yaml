workflows:
  ios-clip:
    name: WebDigi + App Clip → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: WebDigi ASC Key
    environment:
      groups:
        - apple
      xcode: latest
    scripts:
      - name: Xcode projesini üret
        script: |
          brew install xcodegen
          xcodegen generate
      - name: İmzalama dosyalarını üret ve uygula
        script: |
          set -e
          keychain initialize

          openssl genrsa -out /tmp/cert_key.pem 2048

          app-store-connect certificates create \
            --type IOS_DISTRIBUTION \
            --certificate-key=@file:/tmp/cert_key.pem \
            --save

          app-store-connect fetch-signing-files com.webdigistore.kur \
            --type IOS_APP_STORE --platform IOS --create \
            --certificate-key=@file:/tmp/cert_key.pem

          app-store-connect fetch-signing-files com.webdigistore.kur.Clip \
            --type IOS_APP_STORE --platform IOS --create \
            --certificate-key=@file:/tmp/cert_key.pem

          keychain add-certificates
          xcode-project use-profiles --warn-only

          echo "--- profiller ---"
          ls -la ~/Library/MobileDevice/Provisioning\ Profiles/ || echo "PROFIL YOK"
      - name: Build numarasını artır
        script: |
          BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((BUILD + 1))
      - name: Derle
        script: |
          xcode-project build-ipa --project WebDigi.xcodeproj --scheme WebDigi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
