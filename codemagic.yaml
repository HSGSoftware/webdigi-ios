workflows:
  ios-clip:
    name: WebDigi + App Clip → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: WebDigi ASC Key
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.webdigistore.kur
      vars:
        DEVELOPMENT_TEAM: $DEVELOPMENT_TEAM   # Codemagic → app → Environment variables'a ekle
    scripts:
      - name: Xcode projesini üret
        script: |
          brew install xcodegen
          xcodegen generate
      - name: İmzalama dosyalarını çek (app + clip)
        script: |
          app-store-connect fetch-signing-files com.webdigistore.kur      --type IOS_APP_STORE --create
          app-store-connect fetch-signing-files com.webdigistore.kur.Clip --type IOS_APP_STORE --create
          xcode-project use-profiles
      - name: Build numarasını artır
        script: |
          BUILD=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          agvtool new-version -all $((BUILD + 1))
      - name: Derle
        script: |
          xcode-project build-ipa --project WebDigi.xcodeproj --scheme WebDigi
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
